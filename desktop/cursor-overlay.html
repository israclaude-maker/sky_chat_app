<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw; height: 100vh;
  }
  #cur {
    position: absolute;
    left: -100px; top: -100px;
    display: flex;
    align-items: flex-start;
    gap: 2px;
    pointer-events: none;
    will-change: left, top;
  }
  #label {
    background: #3b82f6;
    color: #fff;
    font-family: Segoe UI, sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    margin-top: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div id="cur">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path d="M4 2L4 18L8 14L11 20L13 19L10 13L16 13Z" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <span id="label">Controller</span>
  </div>

<script>
  const { ipcRenderer } = require("electron");
  const cur = document.getElementById("cur");
  const label = document.getElementById("label");

  ipcRenderer.on("set-name", (event, name) => {
    label.textContent = name || "Controller";
  });

  ipcRenderer.on("move-cursor", (event, pos) => {
    cur.style.left = pos.x + "px";
    cur.style.top = pos.y + "px";
  });
</script>
</body>
</html>
